[build]
command = 'mkdir -p assets; for f in assets_src/*.b64; do n=$(basename "$f" .b64); base64 -d "$f" > "assets/$n"; done; for base in pano img0 img1 img2 img3; do set -- assets_src/$base.webp.b64.*; if [ -e "$1" ]; then cat "$@" > /tmp/$base.b64 && base64 -d /tmp/$base.b64 > assets/$base.webp; fi; done'
publish = "."
